<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANANDA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:'Plex Arabic';font-weight:400;font-display:swap;src:url('fonts/plex-arabic-400.woff2') format('woff2')}
@font-face{font-family:'Plex Arabic';font-weight:500;font-display:swap;src:url('fonts/plex-arabic-500.woff2') format('woff2')}
@font-face{font-family:'Plex Arabic';font-weight:600;font-display:swap;src:url('fonts/plex-arabic-600.woff2') format('woff2')}
@font-face{font-family:'Plex';font-weight:400;font-display:swap;src:url('fonts/plex-latin-400.woff2') format('woff2')}
@font-face{font-family:'Plex';font-weight:500;font-display:swap;src:url('fonts/plex-latin-500.woff2') format('woff2')}
@font-face{font-family:'Plex';font-weight:600;font-display:swap;src:url('fonts/plex-latin-600.woff2') format('woff2')}
:root{--bg:#0A0A0A;--card:#161616;--line:#262626;--text:#FFFFFF;--muted:#8E8E8E}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text)}
body{font-family:'Plex Arabic','Plex',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;
  padding:max(18px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom))}
.wrap{max-width:480px;margin:0 auto}
.hero{display:flex;flex-direction:column;align-items:center;padding:26px 0 22px}
.wm{width:min(64vw,260px);height:auto;color:var(--text);fill:currentColor;display:block}
.hi{font-weight:500;font-size:17px;margin-top:16px;color:#DDD}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.t{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;
  padding:18px 4px 14px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  font:inherit;transition:transform .12s ease, background .12s ease}
.t:active{transform:scale(.96);background:#1E1E1E}
.ic{width:48px;height:48px;border-radius:14px;background:#FFF;color:#0A0A0A;display:flex;align-items:center;
  justify-content:center;margin-bottom:8px}
.ic svg{width:28px;height:28px}
.ta{font-weight:600;font-size:14.5px;line-height:1.3}
.te{font-family:'Plex',sans-serif;font-size:11px;color:var(--muted);letter-spacing:.4px}
.note{margin-top:24px;text-align:center;font-size:13px;color:var(--muted);line-height:1.8}
.note span{font-family:'Plex',sans-serif;font-size:11.5px;display:block}
.warn{display:none;margin-top:18px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;
  font-size:13px;color:#DDD;text-align:center;line-height:1.7}
@media (max-width:340px){.tiles{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

    try { tg.ready(); tg.expand(); tg.setHeaderColor('#0A0A0A'); tg.setBackgroundColor('#0A0A0A'); } catch (e) {}
    var u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (u && u.first_name) {
      var hi = document.getElementById('hi');
      hi.textContent = 'أهلاً ' + u.first_name + ' 👋';
    }
  }
  if (!inTelegram) document.getElementById('warn').style.display = 'block';
  document.querySelectorAll('.t').forEach(function (b) {
    b.addEventListener('click', function () {
      var a = b.getAttribute('data-a');
      if (!inTelegram) return;
      try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
      tg.sendData(JSON.stringify({a: a}));     // the bot receives this and answers in the chat
    });
  });
})();
</script>
</body>
</html>
